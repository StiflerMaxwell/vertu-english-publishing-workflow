name: package-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"

      - run: pnpm install --frozen-lockfile
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m pytest scripts/tests skills/vertu-seo-publish-gate/tests --import-mode=importlib
      - run: python3 scripts/validate_bundle.py
      - run: pnpm test:notification
      - run: sha256sum -c MANIFEST.sha256
