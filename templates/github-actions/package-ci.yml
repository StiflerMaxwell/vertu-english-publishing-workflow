name: package-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"

      - run: pnpm install --frozen-lockfile
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python3 scripts/validate_bundle.py

      - name: Notification preview
        run: |
          printf '%s\n' 'CI preview only' > /tmp/vvv-message.txt
          pnpm notify:preview -- \
            --body-file /tmp/vvv-message.txt \
            --receipt-file /tmp/vvv-preview.json
          node -e 'const r=require("/tmp/vvv-preview.json"); if(r.status!=="PREVIEW") process.exit(1)'
